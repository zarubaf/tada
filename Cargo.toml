# The backend workspace. ADR 0002 defines the crates and the direction of their dependencies.
# deny.toml enforces the rules that Cargo cannot see.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/zarubaf/tada"
publish = false

[workspace.dependencies]
tada-domain = { path = "crates/domain" }
tada-app = { path = "crates/app" }
tada-store-pg = { path = "crates/store-pg" }
tada-adapters = { path = "crates/adapters" }
tada-api = { path = "crates/api" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = "2.12.2"
jiff = { version = "0.2.37", features = ["serde", "tzdb-bundle-always"] }
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
json-subscriber = "0.3.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros", "uuid"] }
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["jiff_0_2", "uuid", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.27.0", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
