# Local development services. This file is not a deployment (ADR 0033).
# Start them with `mise run dev:up`. The ports listen on 127.0.0.1 only.

name: tada-dev

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: tada
      POSTGRES_DB: tada
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=tada", "--dbname=tada"]
      interval: 2s
      timeout: 5s
      retries: 30

  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      # Docker mounts the secret files with the mode of the host files (see scripts/dev_secrets.py).
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    secrets:
      - garage_rpc_secret
      - garage_admin_token
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

secrets:
  database_password:
    file: .dev/secrets/database_password
  garage_rpc_secret:
    file: .dev/secrets/garage_rpc_secret
  garage_admin_token:
    file: .dev/secrets/garage_admin_token

volumes:
  postgres:
  garage:
