# Git hooks. Install once with: mise run setup
# The hooks run the same checks as CI, but only on staged files.
pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner
    - name: markdown format
      glob: "*.md"
      run: mdformat --check {staged_files}
    - name: prose style
      glob: "*.md"
      run: vale --minAlertLevel=error {staged_files}
    - name: rust format
      glob: "*.rs"
      run: mise exec -- cargo fmt --all --check

commit-msg:
  jobs:
    - name: conventional commit
      run: uv run --quiet scripts/check_commit_msg.py {1}
