# Prose checks for all Markdown in this repository.
# The Tada style applies a subset of ASD-STE100 (Simplified Technical English).
# See doc/adr/0012-documentation.md and doc/writing.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Tada

[*.md]
BasedOnStyles = Vale, Tada

# Fenced code, inline code and URLs are not prose.
BlockIgnores = (?s)(```.*?```)
TokenIgnores = (\x60[^\n\x60]+\x60), (\[[^\]]+\]\([^)]+\))

[LICENSE]
BasedOnStyles =
