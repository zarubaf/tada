# Single source of truth for tool versions and project tasks.
# Local development and CI both use these pins. See doc/adr/0003-runtime-and-tooling.md.
# rust-toolchain.toml pins the Rust toolchain; rustup installs it.
# Checks read only the Markdown files that Git can track; ignored files stay out.

[tools]
node = "24.21.0"
pnpm = "12.9.1"
uv = "0.12.23"
vale = "3.24.0"
lefthook = "2.1.17"
gitleaks = "8.30.1"
ruff = "0.16.10"
"pipx:mdformat" = { version = "1.0.0", uvx_args = "--with mdformat-gfm --with mdformat-frontmatter" }
cargo-deny = "0.20.2"
"github:oasdiff/oasdiff" = "1.33.0"
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls" }
"github:nextest-rs/nextest" = { version = "0.9.146", version_prefix = "cargo-nextest-" }

# Settings for local development (doc/settings.md). They point to the services of compose.yaml.
# Builds use the committed .sqlx query cache, so they need no database (ADR 0006).
[env]
# rustup installs cargo here; the tasks find it also when the shell PATH does not have it.
_.path = ["{{ env.CARGO_HOME | default(value=env.HOME ~ '/.cargo') }}/bin"]
SQLX_OFFLINE = "true"
TADA_DATABASE_URL = "postgres://tada@127.0.0.1:5432/tada"
TADA_DATABASE_PASSWORD_FILE = "{{config_root}}/.dev/secrets/database_password"
TADA_S3_ENDPOINT = "http://127.0.0.1:3900"
TADA_S3_REGION = "garage"
TADA_S3_BUCKET = "tada"
TADA_S3_ACCESS_KEY_ID_FILE = "{{config_root}}/.dev/secrets/s3_access_key_id"
TADA_S3_SECRET_ACCESS_KEY_FILE = "{{config_root}}/.dev/secrets/s3_secret_access_key"
# Mailpit of compose.yaml takes mail without TLS and without a login. Release builds reject `none`.
TADA_PUBLIC_URL = "http://localhost:5173"
TADA_RATE_LIMIT_KEY_FILE = "{{config_root}}/.dev/secrets/rate_limit_key"
TADA_MAIL_FROM = "tada@example.org"
TADA_MAIL_SMTP_HOST = "127.0.0.1"
TADA_MAIL_SMTP_PORT = "1025"
TADA_MAIL_SMTP_TLS = "none"

[tasks."check:docs-format"]
description = "Check Markdown formatting"
run = "mdformat --check $(git ls-files --cached --others --exclude-standard '*.md')"

[tasks."check:docs-style"]
description = "Check prose style and spelling"
run = "vale --minAlertLevel=error $(git ls-files --cached --others --exclude-standard '*.md')"

[tasks."check:docs"]
description = "Run all documentation checks"
depends = ["check:docs-format", "check:docs-style"]

[tasks."check:secrets"]
description = "Scan the full Git history for secrets"
run = "gitleaks git --redact --no-banner ."

[tasks."check:scripts"]
description = "Lint and format-check Python scripts"
run = ["ruff check .", "ruff format --check ."]

[tasks."check:rust-format"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks."check:rust-lint"]
description = "Lint Rust code; warnings fail"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."check:rust-test"]
description = "Run the Rust tests"
run = [
  "cargo nextest run --workspace --locked --no-tests=pass",
  "cargo test --doc --workspace --locked",
]

[tasks."check:deps"]
description = "Check crate boundaries, licenses and advisories"
run = "cargo deny --workspace --locked check"

[tasks."check:generated"]
description = "Check that the generated files match the code"
run = [
  "cargo run --quiet --locked -p tada -- settings | diff -u doc/settings.md -",
  "cargo run --quiet --locked -p tada -- problems | diff -u doc/problems.md -",
  "cargo run --quiet --locked -p tada -- openapi | diff -u contracts/openapi.json -",
]

[tasks."check:contract"]
description = "Fail on a breaking change of the API contract against main"
run = "uv run --quiet scripts/check_contract.py"

[tasks."check:web"]
description = "Type-check, lint, test and build the web client; skipped when no web file changed"
run = "uv run --quiet scripts/run_when_web_changed.py check:web mise run check:web-always"

[tasks."check:web-always"]
description = "Type-check, lint, test and build the web client"
dir = "apps/web"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm run check",
  "uv run --quiet ../../scripts/check_bundle_size.py",
  # The production build must not contain the component gallery (ADR 0024).
  "! grep -rq Komponenten dist/assets",
]

[tasks."check:browser"]
description = "Run the browser checks of ADR 0024; skipped when no web file changed"
# After the Rust tests: their PostgreSQL and Garage containers time out while Docker pulls this image.
depends = ["check:web", "check:rust-test"]
run = "uv run --quiet scripts/run_when_web_changed.py check:browser uv run --quiet scripts/check_browser.py"

[tasks."gen:screenshots"]
description = "Write the screenshot baselines again, after an intended design change"
run = "uv run --quiet scripts/check_browser.py --update-snapshots"

[tasks."check:no-dev-auth"]
description = "Fail if the Rust sources contain a way around the session and token authenticators"
run = "uv run --quiet scripts/check_no_dev_auth.py"

[tasks."check:scoped-ports"]
description = "Fail if a method of an app port trait has neither an organization scope nor the infrastructure marker"
run = "uv run --quiet scripts/check_scoped_ports.py"

[tasks."check:rust"]
description = "Run all Rust checks"
depends = ["check:rust-format", "check:rust-lint", "check:rust-test", "check:deps", "check:generated", "check:contract", "check:no-dev-auth", "check:scoped-ports"]

[tasks.check]
description = "Run every check that CI runs; skips the web and browser checks when no web file changed"
depends = ["check:docs", "check:secrets", "check:scripts", "check:rust", "check:browser"]

[tasks."check:all"]
description = "Run every check, including the web and browser checks, whatever changed"
env = { TADA_CHECK_ALL = "1" }
run = "mise run check"

[tasks.gen]
description = "Write the files that the code generates: settings, problem codes and the API contract"
run = [
  "cargo run --quiet -p tada -- settings > doc/settings.md",
  "cargo run --quiet -p tada -- problems > doc/problems.md",
  "mkdir -p contracts && cargo run --quiet -p tada -- openapi > contracts/openapi.json",
]

[tasks.fmt]
description = "Format Markdown files in place"
run = "mdformat $(git ls-files --cached --others --exclude-standard '*.md')"

[tasks.lint-prose]
description = "Show all prose findings, including warnings and suggestions"
run = "vale $(git ls-files --cached --others --exclude-standard '*.md')"

[tasks."dev:secrets"]
description = "Generate the missing development secrets"
run = "uv run --quiet scripts/dev_secrets.py"

[tasks."dev:up"]
description = "Start PostgreSQL, Garage and Mailpit for development"
depends = ["dev:secrets"]
run = ["docker compose up --detach --wait", "uv run --quiet scripts/dev_storage.py"]

[tasks."dev:serve"]
description = "Migrate the development database and run tada serve on port 8080"
run = ["cargo run --quiet -p tada -- migrate", "cargo run --quiet -p tada -- serve"]

[tasks."dev:web"]
description = "Run the web client with hot reload; it calls the API of dev:serve"
dir = "apps/web"
run = ["pnpm install --frozen-lockfile", "pnpm dev"]

[tasks."dev:telegram"]
description = "Run the Telegram gateway with the bot token in .dev/secrets/telegram_bot_token"
env = { TADA_TELEGRAM_BOT_TOKEN_FILE = "{{config_root}}/.dev/secrets/telegram_bot_token" }
run = "cargo run --quiet -p tada -- telegram"

[tasks."dev:down"]
description = "Stop the development services; the volumes stay"
run = "docker compose down"

[tasks."db:prepare"]
description = "Migrate the development database and update the .sqlx query cache"
env = { SQLX_OFFLINE = "false" }
run = [
  "DATABASE_URL=postgres://tada:$(cat .dev/secrets/database_password)@127.0.0.1:5432/tada sqlx migrate run --source crates/store-pg/migrations",
  "DATABASE_URL=postgres://tada:$(cat .dev/secrets/database_password)@127.0.0.1:5432/tada cargo sqlx prepare --workspace -- --all-targets",
]

[tasks.setup]
description = "Install pinned tools and Git hooks"
run = ["mise install", "rustup toolchain install", "lefthook install"]

