# cargo-deny policy: crate boundaries, licenses, advisories and sources.
# ADR 0002 defines the boundaries, ADR 0014 the licenses and ADR 0041 the advisory checks.

[graph]
all-features = true

[advisories]
# Each ignored advisory needs a reason and an issue.
ignore = [
  # paste is an unmaintained compile-time macro of frankenstein, with no known vulnerability. https://github.com/zarubaf/tada/issues/1
  { id = "RUSTSEC-2024-0436", reason = "compile-time macro of frankenstein; tracked in https://github.com/zarubaf/tada/issues/1" },
]

[licenses]
# Licenses that are compatible with Apache-2.0 for distribution (ADR 0014).
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# WTFPL permits any use, so it is compatible with Apache-2.0. ADR 0011 chose this crate.
# CDLA-Permissive-2.0 covers the Mozilla CA list, which the TLS stack of frankenstein brings.
# It permits distribution if the license text goes with the data.
exceptions = [
  { allow = ["WTFPL"], crate = "frankenstein" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# A crate in this list can only be a direct dependency of the crates in its `wrappers`.
# This enforces the direction of ADR 0002:
# - Only the binary depends on the adapter crates. It is the composition root.
# - The domain crate depends on no other tada crate.
# - I/O crates are dependencies of adapter crates only.
deny = [
  { crate = "tada-app", wrappers = ["tada-store-pg", "tada-adapters", "tada-api", "tada-telegram", "tada"] },
  { crate = "tada-store-pg", wrappers = ["tada"] },
  { crate = "tada-adapters", wrappers = ["tada"] },
  { crate = "tada-api", wrappers = ["tada"] },
  { crate = "tada-telegram", wrappers = ["tada"] },
  { crate = "sqlx", wrappers = ["tada-store-pg", "jiff-sqlx"] },
  { crate = "aws-sdk-s3", wrappers = ["tada-adapters"] },
  # lettre is the SMTP client of the mail adapter (ADR 0042).
  { crate = "lettre", wrappers = ["tada-adapters"] },
  # frankenstein is the typed Bot API client of the telegram crate (ADR 0011).
  { crate = "reqwest", wrappers = ["tada-adapters", "frankenstein"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
